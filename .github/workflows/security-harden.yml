name: Security hardening (SSH)

# Manual only — install fail2ban (auto-ban brute-force bots) and enforce key-only SSH.
# Safe: never changes the SSH port and never disables key auth (so GitHub deploys + you keep access).
on:
  workflow_dispatch:

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Install fail2ban and enforce key-only SSH
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            set +e
            echo "========================================"
            echo "=== 1) Install fail2ban ==="
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fail2ban

            echo ""
            echo "=== 2) Configure fail2ban jail for SSH ==="
            # Ban an IP for 1h after 4 failed attempts within 10m; repeat offenders banned longer.
            sudo tee /etc/fail2ban/jail.local > /dev/null << 'CONF'
[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 4
backend  = systemd
banaction = iptables-multiport

[sshd]
enabled = true
port    = ssh
mode    = aggressive
CONF

            sudo systemctl enable fail2ban
            sudo systemctl restart fail2ban
            sleep 3

            echo ""
            echo "=== 3) Enforce key-only SSH (disable password login) ==="
            # Drop-in so we don't fight cloud-init's main sshd_config.
            sudo tee /etc/ssh/sshd_config.d/99-julay-hardening.conf > /dev/null << 'SSHCONF'
PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
SSHCONF

            echo "-- validating sshd config before reloading (safety) --"
            if sudo sshd -t; then
              sudo systemctl reload ssh 2>/dev/null || sudo systemctl reload sshd 2>/dev/null
              echo "sshd reloaded ✅ (key-only enforced)"
            else
              echo "❌ sshd config test FAILED — reverting, leaving SSH as-is"
              sudo rm -f /etc/ssh/sshd_config.d/99-julay-hardening.conf
            fi

            echo ""
            echo "========================================"
            echo "=== STATUS REPORT ==="
            echo "-- fail2ban service --"
            sudo systemctl is-active fail2ban
            echo "-- fail2ban sshd jail (banned IPs) --"
            sudo fail2ban-client status sshd 2>/dev/null || echo "(jail starting up)"
            echo "-- effective SSH auth settings --"
            sudo sshd -T 2>/dev/null | grep -iE "^passwordauthentication|^permitrootlogin|^pubkeyauthentication|^challengeresponseauthentication"
            echo "=== Done — server hardened ✅ ==="
          ENDSSH
