name: Deploy to julay.org

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_CLIENT_ID: 722079093063-prb89vbbksnhhrgsi1q785atmgs6hhac.apps.googleusercontent.com
          VITE_PLAUSIBLE_DOMAIN: julay.org
          VITE_SENTRY_DSN: https://f89dc5462cfea4330b27e4357384cbdb@o4511212808175616.ingest.us.sentry.io/4511212814401536
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Free disk space & update server code
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            echo "=== Disk before cleanup ==="
            df -h /

            echo "=== Freeing space: removing frontend node_modules ==="
            rm -rf /home/ubuntu/Julayorg/frontend/node_modules
            rm -rf /home/ubuntu/Julayorg/frontend/.vite

            echo "=== Disk after cleanup ==="
            df -h /

            echo "=== Pulling latest code ==="
            cd /home/ubuntu/Julayorg
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "=== Block external port 5000, allow loopback (for nginx proxy) ==="
            sudo iptables -C INPUT -i lo -p tcp --dport 5000 -j ACCEPT 2>/dev/null || \
              sudo iptables -I INPUT 1 -i lo -p tcp --dport 5000 -j ACCEPT 2>/dev/null || true
            sudo iptables -C INPUT -p tcp --dport 5000 -j DROP 2>/dev/null || \
              sudo iptables -A INPUT -p tcp --dport 5000 -j DROP 2>/dev/null || true

            echo "=== Prepare nginx dist dir ==="
            sudo mkdir -p /var/www/julay/frontend/dist
            sudo chown -R ubuntu:ubuntu /var/www/julay

            echo "=== Ensure uploads directory persists ==="
            mkdir -p /home/ubuntu/Julayorg/backend/uploads
            chmod 755 /home/ubuntu/Julayorg/backend/uploads

            echo "=== Install & restart backend ==="
            cd backend
            rm -rf node_modules
            npm ci --production
            pm2 delete julay-backend 2>/dev/null || true
            pm2 start /home/ubuntu/Julayorg/backend/server.js --name julay-backend --cwd /home/ubuntu/Julayorg/backend

            echo "=== Wait 15s then check backend health ==="
            sleep 15
            pm2 status julay-backend
            pm2 logs julay-backend --lines 50 --nostream || true
            if curl -sf http://localhost:5000/health; then
              echo "BACKEND HEALTHY ✅"
            else
              echo "BACKEND NOT RESPONDING ❌ — forcing restart"
              pm2 restart julay-backend
              sleep 10
              pm2 logs julay-backend --lines 20 --nostream || true
              curl -sf http://localhost:5000/health && echo "BACKEND HEALTHY AFTER RETRY ✅" || echo "BACKEND STILL DOWN ❌"
            fi
          ENDSSH

      - name: Inject secrets into .env
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << ENDSSH
            touch /home/ubuntu/Julayorg/backend/.env
            grep -q '^GOOGLE_CLIENT_ID=' /home/ubuntu/Julayorg/backend/.env \
              && sed -i 's|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=722079093063-prb89vbbksnhhrgsi1q785atmgs6hhac.apps.googleusercontent.com|' /home/ubuntu/Julayorg/backend/.env \
              || echo 'GOOGLE_CLIENT_ID=722079093063-prb89vbbksnhhrgsi1q785atmgs6hhac.apps.googleusercontent.com' >> /home/ubuntu/Julayorg/backend/.env
            grep -q '^GOOGLE_CLIENT_SECRET=' /home/ubuntu/Julayorg/backend/.env \
              && sed -i 's|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}|' /home/ubuntu/Julayorg/backend/.env \
              || echo 'GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}' >> /home/ubuntu/Julayorg/backend/.env
            grep -q '^JWT_SECRET=' /home/ubuntu/Julayorg/backend/.env \
              && sed -i 's|^JWT_SECRET=.*|JWT_SECRET=${{ secrets.JWT_SECRET }}|' /home/ubuntu/Julayorg/backend/.env \
              || echo 'JWT_SECRET=${{ secrets.JWT_SECRET }}' >> /home/ubuntu/Julayorg/backend/.env
            grep -q '^STRIPE_SECRET_KEY=' /home/ubuntu/Julayorg/backend/.env \
              && sed -i 's|^STRIPE_SECRET_KEY=.*|STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}|' /home/ubuntu/Julayorg/backend/.env \
              || echo 'STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}' >> /home/ubuntu/Julayorg/backend/.env
            grep -q '^STRIPE_WEBHOOK_SECRET=' /home/ubuntu/Julayorg/backend/.env \
              && sed -i 's|^STRIPE_WEBHOOK_SECRET=.*|STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}|' /home/ubuntu/Julayorg/backend/.env \
              || echo 'STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}' >> /home/ubuntu/Julayorg/backend/.env
            grep -q '^ANALYTICS_SECRET=' /home/ubuntu/Julayorg/backend/.env \
              && sed -i 's|^ANALYTICS_SECRET=.*|ANALYTICS_SECRET=${{ secrets.ANALYTICS_SECRET }}|' /home/ubuntu/Julayorg/backend/.env \
              || echo 'ANALYTICS_SECRET=${{ secrets.ANALYTICS_SECRET }}' >> /home/ubuntu/Julayorg/backend/.env
            pm2 restart julay-backend
          ENDSSH

      - name: Upload frontend dist via tar+SSH
        run: |
          tar -czf /tmp/frontend.tar.gz -C frontend/dist .
          scp -i ~/.ssh/deploy_key /tmp/frontend.tar.gz ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/frontend.tar.gz
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            set -e
            echo "=== Deploying to /home/ubuntu/Julayorg/frontend/dist (ACTUAL nginx root) ==="
            rm -rf /home/ubuntu/Julayorg/frontend/dist
            mkdir -p /home/ubuntu/Julayorg/frontend/dist
            tar -xzf /tmp/frontend.tar.gz -C /home/ubuntu/Julayorg/frontend/dist/
            echo "=== Also deploying to /var/www/julay/frontend/dist ==="
            sudo mkdir -p /var/www/julay/frontend/dist
            sudo chown ubuntu:ubuntu /var/www/julay/frontend/dist
            rm -rf /var/www/julay/frontend/dist/*
            tar -xzf /tmp/frontend.tar.gz -C /var/www/julay/frontend/dist/
            rm /tmp/frontend.tar.gz
            echo "=== VERIFY ==="
            ls /home/ubuntu/Julayorg/frontend/dist/
          ENDSSH

      - name: Deploy analytics dashboard
        run: |
          scp -i ~/.ssh/deploy_key analytics/index.html ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/analytics_index.html
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            set -e
            sudo mkdir -p /var/www/julay/analytics
            sudo chown ubuntu:ubuntu /var/www/julay/analytics
            cp /tmp/analytics_index.html /var/www/julay/analytics/index.html
            rm /tmp/analytics_index.html
          ENDSSH

      - name: Deploy & start monitor agent
        run: |
          scp -i ~/.ssh/deploy_key monitor/monitor.js ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/julay_monitor.js
          scp -i ~/.ssh/deploy_key monitor/package.json ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/julay_monitor_pkg.json
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            set -e
            mkdir -p /home/ubuntu/Julayorg/monitor
            cp /tmp/julay_monitor.js /home/ubuntu/Julayorg/monitor/monitor.js
            cp /tmp/julay_monitor_pkg.json /home/ubuntu/Julayorg/monitor/package.json
            cd /home/ubuntu/Julayorg/monitor
            npm install --production
            pm2 delete julay-monitor 2>/dev/null || true
            SMTP_HOST=smtp.gmail.com SMTP_PORT=587 SMTP_USER=julaytech@gmail.com SMTP_PASS=nxdczdhcgyyabyid \
              pm2 start monitor.js --name julay-monitor --cwd /home/ubuntu/Julayorg/monitor
            pm2 save
            echo "=== Monitor started ==="
            pm2 status julay-monitor
          ENDSSH

      - name: Reload nginx & setup analytics subdomain SSL
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            echo "=== SETUP NGINX SYMLINKS ==="
            sudo ln -sf /etc/nginx/sites-available/julay.org /etc/nginx/sites-enabled/julay.org
            sudo rm -f /etc/nginx/sites-enabled/default

            echo "=== EXPAND SSL CERT FOR analytics.julay.org ==="
            sudo certbot certonly --nginx --non-interactive --agree-tos \
              --expand -d julay.org -d www.julay.org -d analytics.julay.org \
              --email assimohammad489@gmail.com 2>&1 || echo "CERTBOT: cert already up to date or failed"

            echo "=== APPLYING NGINX CONFIG (after certbot so it cannot overwrite ours) ==="
            sudo cp /home/ubuntu/Julayorg/nginx.conf /etc/nginx/sites-available/julay.org

            echo "=== RELOAD NGINX ==="
            sudo nginx -t && sudo systemctl reload nginx && echo "NGINX RELOADED OK"
          ENDSSH
