name: Build Android (Release AAB + APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/vite.config.*'
      - 'frontend/capacitor.config.ts'
      - 'frontend/android/**'
      - 'frontend/package.json'

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install frontend deps
        working-directory: frontend
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci

      - name: Build web dist
        working-directory: frontend
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_PLAUSIBLE_DOMAIN: julay.org
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Sync Capacitor → Android
        working-directory: frontend
        run: npx cap sync android 2>&1

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/julay-release.keystore

      - name: Make Gradle wrapper executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Set version from run number
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Release AAB (Play Store)
        working-directory: frontend/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_PATH: /tmp/julay-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Build Release APK (direct install)
        working-directory: frontend/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_PATH: /tmp/julay-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect outputs
        run: |
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab /tmp/julay-release.aab
          cp frontend/android/app/build/outputs/apk/release/app-release.apk /tmp/julay.apk
          echo "AAB: $(du -sh /tmp/julay-release.aab | cut -f1)"
          echo "APK: $(du -sh /tmp/julay.apk | cut -f1)"

      - name: Upload APK to server (direct download link)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key /tmp/julay.apk \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/julay.apk
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            sudo chown ubuntu:ubuntu /var/www/julay/frontend/dist 2>/dev/null || true
            mv /tmp/julay.apk /var/www/julay/frontend/dist/julay.apk
            chmod 644 /var/www/julay/frontend/dist/julay.apk
            echo "APK deployed: $(ls -lh /var/www/julay/frontend/dist/julay.apk)"
          ENDSSH

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: julay-android-aab-${{ github.run_number }}
          path: /tmp/julay-release.aab
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: julay-android-apk-${{ github.run_number }}
          path: /tmp/julay.apk
          retention-days: 90
